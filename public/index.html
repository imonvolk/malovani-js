<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sdílené Malování</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; height: 100vh; overflow: hidden; }

    #loginScreen {
      display: flex; justify-content: center; align-items: center; height: 100vh;
    }
    #loginScreen.hidden { display: none; }

    #loginBox {
      background: #16213e; border: 1px solid #0f3460; border-radius: 12px;
      padding: 40px; display: flex; flex-direction: column; gap: 12px; min-width: 320px;
    }
    #loginBox h1 { font-size: 1.4rem; text-align: center; margin-bottom: 8px; }

    #usernameInput {
      padding: 10px 14px; border-radius: 8px; border: 1px solid #0f3460;
      background: #1a1a2e; color: #fff; font-size: 1rem; outline: none;
    }
    #usernameInput::placeholder { color: #666; }

    .user-select-btn {
      padding: 10px; border-radius: 8px; border: 1px solid #0f3460;
      background: #1a1a2e; color: #aaa; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
    }
    .user-select-btn:hover { background: #0f3460; color: #fff; }
    .user-select-btn.selected { background: #e94560; border-color: #e94560; color: #fff; }

    #startBtn {
      padding: 10px; border-radius: 8px; border: none;
      background: #e94560; color: #fff; font-size: 1rem; font-weight: bold;
      cursor: pointer; transition: opacity 0.2s; margin-top: 4px;
    }
    #startBtn:hover { opacity: 0.85; }

    #appWindow { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
    #appWindow.hidden { display: none; }
  </style>
</head>
<body>
  <div id="loginScreen">
    <div id="loginBox">
      <h1>Sdílené Malování</h1>
      <input type="text" id="usernameInput" placeholder="Tvoje jméno…" maxlength="24" autocomplete="off">
      <p style="font-size:0.8rem;color:#888;margin-bottom:4px;">Vyber svůj profil:</p>
      <button class="user-select-btn" data-member="Osoba A">Osoba A</button>
      <button class="user-select-btn" data-member="Osoba B">Osoba B</button>
      <button class="user-select-btn" data-member="Osoba C">Osoba C</button>
      <button id="startBtn">Vstoupit</button>
    </div>
  </div>

  <div id="appWindow" class="hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
  <script src="scriptA.js"></script>
  <script src="scriptB.js"></script>
  <script src="scriptC.js"></script>
</body>
</html>
