<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sdílené Malování</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; }
    .hidden { display: none !important; }

    #appWindow { width: 100vw; height: 100vh; position: relative; }

    .login-screen {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 10; font-family: 'MS Sans Serif', Tahoma, sans-serif;
    }
    .login-card {
      width: min(90vw, 420px); background: #f0f0f0;
      border: 2px outset #c0c0c0; padding: 20px;
      box-shadow: 0 0 0 4px rgba(0,0,0,0.1);
    }
    .login-card h1 { font-size: 18px; margin-bottom: 14px; text-align: center; }
    .login-card label { font-size: 12px; display: block; margin-bottom: 4px; }
    .login-card input[type="text"] {
      width: 100%; padding: 8px; font-size: 14px; margin-bottom: 12px;
      border: 1px solid #888; background: white;
    }
    .user-buttons {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; margin-bottom: 12px;
    }
    .user-select-btn {
      padding: 10px 8px; font-size: 13px; cursor: pointer;
      border: 2px outset #c0c0c0; background: #d0d0d0;
    }
    .user-select-btn.selected { background: #1084d0; color: #fff; border-color: #000080; }
    .login-card button {
      width: 100%; padding: 10px; font-size: 14px; cursor: pointer;
      border: 2px outset #c0c0c0; background: #c0c0c0;
    }
    .login-card button:hover { background: #d0d0d0; }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>Vítejte v malování</h1>
      <label for="usernameInput">Zadejte své uživatelské jméno</label>
      <input id="usernameInput" type="text" placeholder="Např. Karel" autocomplete="off">
      <label>Vyberte si profil</label>
      <div class="user-buttons">
        <button type="button" class="user-select-btn" data-member="Osoba A">Osoba A</button>
        <button type="button" class="user-select-btn" data-member="Osoba B">Osoba B</button>
        <button type="button" class="user-select-btn" data-member="Osoba C">Osoba C</button>
      </div>
      <button id="startBtn" type="button">Spustit malování</button>
    </div>
  </div>

  <div id="appWindow" class="hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
  <script src="scriptA.js"></script>
  <script src="scriptB.js"></script>
  <script src="scriptC.js"></script>
</body>
</html>
